<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>no-fuss covers</title>
<style>
@font-face{font-family:"Geist Mono";font-weight:400;src:url(../fonts/f1.ttf)}
@font-face{font-family:"TikTok Sans";font-weight:500;src:url(../fonts/f3.ttf)}
@font-face{font-family:"TikTok Sans";font-weight:700;src:url(../fonts/f4.ttf)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000}
#s{position:relative;overflow:hidden;font-family:"TikTok Sans",sans-serif;color:#101318}
#scene{position:absolute;inset:0}
.obj{position:absolute;transform-origin:center}
/* iPhone: tytanowa rama, czarna ramka, wyspa, przyciski, odblask */
.iph{position:absolute;border-radius:16%/7.6%;padding:2.2%;
  background:linear-gradient(135deg,#d7d8dc 0%,#8e9097 18%,#f2f2f4 38%,#7b7d84 60%,#c9cacf 82%,#9a9ca2 100%);
  box-shadow:var(--sh)}
.iph .bez{position:relative;width:100%;height:100%;background:#050607;border-radius:14%/6.6%;padding:3.6%}
.iph .scr{position:relative;width:100%;height:100%;border-radius:11.5%/5.4%;overflow:hidden;background:#fff}
.iph .scr img{position:absolute;left:0;top:0;width:100%;display:block}
.iph .isl{position:absolute;left:50%;top:2.6%;width:31%;height:3.4%;margin-left:-15.5%;background:#000;border-radius:99px;z-index:2}
.iph .glare{position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,0) 38%,rgba(255,255,255,0) 70%,rgba(255,255,255,.06) 100%);z-index:3}
.iph .btn{position:absolute;width:1.2%;background:linear-gradient(90deg,#6f7178,#d9dadd);border-radius:2px}
/* MacBook rozłożony płasko: ekran + podstawa */
.mbp{position:absolute;display:flex;flex-direction:column;align-items:center;filter:var(--fsh)}
.mbp .lid{position:relative;width:100%;background:linear-gradient(180deg,#2a2c30,#151619);border-radius:2.2%/3.4%;padding:2.1% 2.1% 3.2%}
.mbp .lid .scr{position:relative;width:100%;aspect-ratio:16/10.3;overflow:hidden;border-radius:.6%;background:#000}
.mbp .lid .scr img{position:absolute;left:0;top:0;width:100%;display:block}
.mbp .lid .notch{position:absolute;left:50%;top:2.1%;width:11%;height:2.6%;margin-left:-5.5%;background:#151619;border-radius:0 0 8px 8px;z-index:2}
.mbp .lid .glare{position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.14),rgba(255,255,255,0) 45%);pointer-events:none}
.mbp .hinge{width:100%;height:12px;background:linear-gradient(180deg,#5d6066,#c3c5ca 40%,#8a8d93)}
.mbp .base{position:relative;width:100%;aspect-ratio:16/10.6;background:linear-gradient(160deg,#e3e4e7,#c6c8cd 55%,#d9dadd);border-radius:0 0 3%/0 0 4.5%;padding:4.5% 6% 0}
.mbp .kb{width:100%;aspect-ratio:16/6.4;background:#1a1b1e;border-radius:6px;padding:.8%;
  background-image:repeating-linear-gradient(90deg,transparent 0 5.6%,#c4c6cb 5.6% 6.67%),repeating-linear-gradient(0deg,transparent 0 13.6%,#c4c6cb 13.6% 16.67%);background-color:#141518;border-radius:3px}
.mbp .tp{width:42%;aspect-ratio:16/10;margin:3.6% auto 0;background:linear-gradient(160deg,#d4d5d9,#bfc1c6);border-radius:3%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
/* światło */
#gobo{position:absolute;inset:-10%;pointer-events:none;mix-blend-mode:multiply;z-index:20}
#grain{position:absolute;inset:0;pointer-events:none;z-index:21;opacity:.16;mix-blend-mode:overlay}
#warm{position:absolute;inset:0;pointer-events:none;z-index:19;background:radial-gradient(80% 70% at 20% 10%,rgba(255,250,235,.28),rgba(255,250,235,0) 60%),radial-gradient(90% 80% at 90% 100%,rgba(0,0,0,.12),rgba(0,0,0,0) 60%)}
/* typografia */
.lab{position:absolute;z-index:30;left:64px;right:64px;display:flex;justify-content:space-between;align-items:baseline}
.wm{font-weight:700;font-size:38px;line-height:1}
.mono{font-family:"Geist Mono",monospace;font-size:22px;line-height:30px;text-transform:uppercase}
.big{font-weight:700;text-transform:uppercase;line-height:.9;font-size:120px}
.tag{background:#101318;color:#BBFF00;padding:3px 12px}
.onpaper .tag{background:#BBFF00;color:#101318}
</style>
</head>
<body>
<div id="s">
  <div id="scene"></div>
  <div id="warm"></div>
  <svg id="gobo"></svg>
  <svg id="grain"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1 0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
  <div class="lab" id="lt"></div>
  <div class="lab" id="lb"></div>
</div>
<script>
const A = '../../../public/assets/';
const Q = new URLSearchParams(location.search), id = Q.get('id'), fmt = Q.get('fmt') || 'feed';
const W = 1080, H = fmt === 'story' ? 1920 : 1350, top0 = fmt === 'story' ? 250 : 64, bot0 = fmt === 'story' ? 420 : 64;
const S = document.getElementById('s'); S.style.width = W + 'px'; S.style.height = H + 'px';
const LIME = '#BBFF00', PAPER = '#E8E6E0';
// cień twardego słońca z lewej góry
const SH = 'drop-shadow(26px 34px 6px rgba(20,28,0,.38)) drop-shadow(6px 8px 3px rgba(20,28,0,.25))';
const BSH = '26px 34px 6px rgba(20,28,0,.38), 6px 8px 3px rgba(20,28,0,.25)';

function phone(src, w, x, y, rot, off = 0) {
  const h = w * 2.05;
  return `<div class="obj" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;transform:rotate(${rot}deg)">
    <div class="iph" style="inset:0;--sh:${BSH}"><div class="bez"><div class="scr"><img src="${A + src}" style="top:${-off}%"><div class="glare"></div></div><div class="isl"></div></div>
    <div class="btn" style="left:-0.6%;top:18%;height:5%"></div><div class="btn" style="left:-0.6%;top:26%;height:9%"></div><div class="btn" style="right:-0.6%;top:24%;height:12%"></div></div></div>`;
}
function laptop(src, w, x, y, rot) {
  return `<div class="obj mbp" style="left:${x}px;top:${y}px;width:${w}px;transform:rotate(${rot}deg);--fsh:${SH}">
    <div class="lid"><div class="notch"></div><div class="scr"><img src="${A + src}"></div><div class="glare"></div></div><div class="hinge"></div>
    <div class="base"><div class="kb"></div><div class="tp"></div></div></div>`;
}
// cień żaluzji / liści
function goboBlinds(angle, op) {
  let s = `<defs><filter id="b"><feGaussianBlur stdDeviation="7"/></filter></defs><g filter="url(#b)" transform="rotate(${angle} ${W / 2} ${H / 2})" opacity="${op}">`;
  for (let y = -H; y < H * 2; y += 130) s += `<rect x="${-W}" y="${y}" width="${W * 3}" height="58" fill="#3b4a10"/>`;
  return s + '</g>';
}
function goboLeaves(op, cx, cy) {
  let s = `<defs><filter id="l"><feGaussianBlur stdDeviation="9"/></filter></defs><g filter="url(#l)" opacity="${op}" fill="#2f3a0d">`;
  for (let i = 0; i < 9; i++) { const a = -60 + i * 16, r = 260 + (i % 3) * 60;
    s += `<ellipse cx="${cx + Math.cos(a * Math.PI / 180) * r * .6}" cy="${cy + Math.sin(a * Math.PI / 180) * r * .6}" rx="${r * .55}" ry="34" transform="rotate(${a} ${cx + Math.cos(a * Math.PI / 180) * r * .6} ${cy + Math.sin(a * Math.PI / 180) * r * .6})"/>`; }
  return s + `<rect x="${cx - 12}" y="${cy}" width="18" height="${H}" transform="rotate(-24 ${cx} ${cy})"/></g>`;
}

// v2: jedno urządzenie, mały podpis
function phone2(src, w, cx, cy, rot, off = 0) {
  const h = Math.round(w * 2.06), x = cx - w / 2, y = cy - h / 2;
  return `<div class="obj" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;transform:rotate(${rot}deg)">
    <div style="position:absolute;inset:0;border-radius:16%/7.8%;transform:translate(26px,38px);background:rgba(20,26,0,.34);filter:blur(5px)"></div>
    <div style="position:absolute;inset:0;border-radius:16%/7.8%;transform:translate(4px,6px);background:rgba(10,14,0,.45);filter:blur(3px)"></div>
    <div style="position:absolute;inset:0;border-radius:16%/7.8%;transform:translate(3px,4px);background:linear-gradient(135deg,#7d8087,#4b4e54)"></div>
    <div class="iph" style="inset:0;padding:1.3%;--sh:none;border-radius:16%/7.8%"><div class="bez" style="padding:3.2%;border-radius:15%/7.2%"><div class="scr" style="border-radius:12.4%/5.9%"><img src="${A + src}" style="top:${-off}%"><div class="glare"></div></div><div class="isl" style="top:2.4%;height:3.1%"></div></div>
    <div class="btn" style="left:-0.7%;top:17%;height:4%"></div><div class="btn" style="left:-0.7%;top:24%;height:7.5%"></div><div class="btn" style="left:-0.7%;top:33%;height:7.5%"></div><div class="btn" style="right:-0.7%;top:26%;height:11%"></div></div></div>`;
}
const C = {
  ah: { bg: LIME, name: 'Automation House', meta: 'Strona WWW · 2026', src: 'automation-house/m-full.webp', rot: -12, g: () => goboBlinds(-32, .22) },
  otb: { bg: PAPER, name: 'OTB Ventures', meta: 'Strona WWW · 2025', src: 'otb/m-00.webp', rot: 10, g: () => goboLeaves(.2, 980, 140), paper: true },
  busybee: { bg: LIME, name: 'Busy Bee Film', meta: 'Strona WWW · 2024', src: 'busybee/m-00.webp', rot: -9, g: () => goboBlinds(28, .2) },
  ourmoney: { bg: LIME, name: 'OurMoney', meta: 'Aplikacja mobilna · produkt własny', src: 'ourmoney/ekran-glowny-rownowaga.webp', rot: 11, g: () => goboLeaves(.18, 100, H * .8) },
  sassy: { bg: PAPER, name: 'Sassy', meta: 'Eksperyment · 2026', src: 'sassy/m-00.webp', rot: -11, g: () => goboBlinds(-38, .16), paper: true }
};
const c = C[id];
S.style.background = c.bg; if (c.paper) S.classList.add('onpaper');
const pw = fmt === 'story' ? 520 : 470;
document.getElementById('scene').innerHTML = phone2(c.src, pw, W / 2 + 10, (top0 + 90 + H - bot0 - 110) / 2, c.rot);
const g = document.getElementById('gobo'); g.setAttribute('viewBox', `0 0 ${W} ${H}`); g.innerHTML = "";
const lt = document.getElementById('lt'); lt.style.top = top0 + 'px';
lt.innerHTML = `<span class="wm" style="font-size:34px">no–fuss</span><span class="mono">no-fuss.house</span>`;
const lb = document.getElementById('lb'); lb.style.bottom = bot0 + 'px'; lb.style.alignItems = 'flex-end';
lb.innerHTML = `<span style="font-weight:500;font-size:44px;line-height:1.1">${c.name}</span><span class="mono" style="opacity:.75">${c.meta}</span>`;
window.ready = (async () => { await document.fonts.ready; await Promise.all([...document.images].map(im => im.complete ? 0 : new Promise(r => im.onload = im.onerror = r))); return true; })();
</script>
</body>
</html>
